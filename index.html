<header>
  <div class="wrap">
    <!-- Judul baru -->
    <h1>Price & Stock List - Sales</h1>
    <div class="sub">Updated Price List dan Stock Gudang Utama</div>

    <!-- Welcome user -->
    <div class="welcome hide" id="welcomeUser"></div>

    <div class="topbar">
      <div class="tabs">
        <button class="tab active" data-tab="sales">Sales</button>
        <button class="tab" data-tab="admin">Admin</button>
      </div>
      <div class="row">
        <!-- Tombol Setup Supabase bisa dihapus jika tidak perlu -->
        <!--<button class="btn secondary" id="setupBtn">Setup Supabase</button>-->
        <button class="btn secondary" id="refreshBtn">Refresh Data</button>
      </div>
    </div>

    <!-- Grid metrics -->
    <div class="grid">
      <div class="card">
        <div class="label">Total Produk</div>
        <div class="metric" id="mProducts">0</div>
      </div>
      <div class="card">
        <div class="label">Produk Ada Promo</div>
        <div class="metric" id="mPromo">0</div>
      </div>
      <div class="card">
        <div class="label">Update Terakhir</div>
        <div class="metric" id="mUpdated">-</div>
      </div>
      <div class="card">
        <div class="label">Upload Oleh</div>
        <!-- Email dibuat lebih kecil -->
        <div class="metric" id="mBy" style="font-size:12px; font-weight:normal;">-</div>
      </div>
    </div>
  </div>
</header>
