<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard Pricelist Sales</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--pri:#2563eb;--ok:#16a34a;--warn:#f59e0b;--bad:#dc2626;--shadow:0 10px 30px rgba(15,23,42,.08)}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
    header{background:linear-gradient(135deg,#1d4ed8,#0f172a);color:white;padding:28px 20px}
    .wrap{max-width:1180px;margin:auto}
    h1{margin:0;font-size:28px}
    .sub{margin-top:8px;opacity:.85}
    .topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:18px}
    .tabs{display:flex;gap:8px}
    .tab,.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}
    .tab{background:rgba(255,255,255,.16);color:white}
    .tab.active{background:white;color:#1d4ed8}
    .btn{background:var(--pri);color:white}
    .btn.secondary{background:#eef2ff;color:#1d4ed8}
    .btn.danger{background:var(--bad)}
    .btn.ok{background:var(--ok)}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    main{padding:22px 20px 50px}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
    .metric{font-size:24px;font-weight:800;margin-top:8px}
    .label{color:var(--muted);font-size:13px}
    .panel{display:none}
    .panel.active{display:block}
    .toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
    .search{display:flex;gap:8px;flex-wrap:wrap}
    .input,select{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:white;min-width:220px}
    .tablebox{overflow:auto;background:white;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
    table{border-collapse:collapse;width:100%;min-width:980px}
    th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    th{position:sticky;top:0;background:#f9fafb;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#374151}
    td{font-size:14px}
    .price{font-weight:800}
    .promo{display:inline-block;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;border-radius:999px;padding:4px 8px;font-weight:700;margin:2px}
    .promo-stack{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
    .stock{font-weight:800;color:#065f46}
    .muted{color:var(--muted)}
    .hide{display:none!important}
    .notice{border-left:4px solid var(--pri);background:#eff6ff;padding:12px 14px;border-radius:12px;margin-bottom:14px}
    .drop{border:2px dashed #93c5fd;background:#eff6ff;border-radius:18px;padding:24px;text-align:center;margin-bottom:16px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:18px}
    .modal.open{display:flex}
    .modal .card{max-width:720px;width:100%}
    pre{white-space:pre-wrap;background:#0f172a;color:#e5e7eb;border-radius:14px;padding:14px;overflow:auto;font-size:12px}
    .small{font-size:12px;color:var(--muted)}
    .welcome{margin-top:10px;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:8px 12px;font-weight:700}
    .welcome.hide{display:none}
    .forgot-link{display:inline-block;margin-top:10px;color:#2563eb;text-decoration:none;font-size:14px;font-weight:700}
    .forgot-link:hover{text-decoration:underline}
    @media(max-width:800px){
      .grid{grid-template-columns:repeat(2,1fr)}
      .input{min-width:100%}
      .search{width:100%}
      .search>*{flex:1}
      .toolbar{align-items:stretch}
      .tab,.btn{padding:10px 12px}
      h1{font-size:23px}
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Dashboard Pricelist Sales</h1>
      <div class="sub">Sales melihat harga jual dan promo terbaru. Admin upload data Excel harian dari sistem.</div>
      <div class="welcome hide" id="welcomeUser"></div>
      <div class="topbar">
        <div class="tabs">
          <button class="tab active" data-tab="sales">Sales</button>
          <button class="tab" data-tab="admin">Admin</button>
        </div>
        <div class="row">
          <button class="btn secondary" id="setupBtn">Setup Supabase</button>
          <button class="btn secondary" id="refreshBtn">Refresh Data</button>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="sales" class="panel active">
      <div class="grid">
        <div class="card"><div class="label">Total Produk</div><div class="metric" id="mProducts">0</div></div>
        <div class="card"><div class="label">Produk Ada Promo</div><div class="metric" id="mPromo">0</div></div>
        <div class="card"><div class="label">Update Terakhir</div><div class="metric" id="mUpdated">-</div></div>
        <div class="card"><div class="label">Upload Oleh</div><div class="metric" id="mBy">-</div></div>
      </div>
      <div class="toolbar">
        <div class="search">
          <input class="input" id="q" placeholder="Cari kode / nama barang..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
          <select id="promoFilter">
            <option value="all">Semua produk</option>
            <option value="promo">Hanya promo</option>
            <option value="stock">Stock tersedia</option>
            <option value="empty">Stock kosong</option>
          </select>
        </div>
        <button class="btn ok hide" id="exportBtn">Export Tampilan</button>
      </div>
      <div class="tablebox">
        <table>
          <thead>
            <tr>
              <th>Kode</th>
              <th>Nama Barang</th>
              <th>Stock Gudang</th>
              <th>Harga PCS</th>
              <th>Harga DUS</th>
              <th>Harga PAK</th>
              <th>Promo</th>
              <th>Keterangan</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="8" class="muted">Belum ada data.</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- admin section tetap sama -->
  </main>

<script>
// ===== SUPABASE & HELPER FUNCTIONS =====
const SUPABASE_URL = "https://mitjosxpyeydjdrpuszl.supabase.co";
const SUPABASE_KEY = "sb_publishable_-wwqDu_np893Rg32XajLEQ_w0-5MvBD";

const USER_ROLES = {
  "939e3199-13c3-4d02-91d8-ffea5f5af023": { name: "Admin", role: "admin" },
  "95ff6198-343c-45ea-bda9-17d1b106a341": { name: "Denny", role: "sales" }
};

let sb = null, latestUpload = null, rows = [], previewRows = [], currentProfile = null;
const $ = s => document.querySelector(s);
const fmt = n => n == null || n === '' ? '-' : new Intl.NumberFormat('id-ID', { style:'currency', currency:'IDR', maximumFractionDigits:0 }).format(Number(n) || 0);
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g,'');
const text = v => String(v ?? '').trim();
const pick = (obj, keys) => {
  const map = {};
  Object.keys(obj).forEach(k => map[norm(k)] = k);
  for (const key of keys) {
    const found = map[norm(key)];
    if (found !== undefined) return obj[found];
  }
  return '';
};
const num = v => {
  if (v == null || v === '') return null;
  const x = String(v).replace(/[^0-9,.-]/g,'').replace(/\./g,'').replace(',','.');
  const n = Number(x);
  return Number.isFinite(n) ? n : null;
};

// ===== RENDER & FILTER =====
function renderRows(data){
  const q = norm($('#q').value);
  const f = $('#promoFilter').value;

  let out = data
    .filter(r => (!q || norm(`${r.code || ''} ${r.name || ''}`).includes(q)))
    .filter(r => {
      if(f === 'all') return true;
      if(f === 'promo') return promoCount(r.promos) > 0;
      if(f === 'stock') return Number(r.stock_number) > 0;
      if(f === 'empty') return !r.stock_number || Number(r.stock_number) <= 0;
    });

  $('#mProducts').textContent = data.length;
  $('#mPromo').textContent = data.filter(r => promoCount(r.promos) > 0).length;
  $('#mUpdated').textContent = latestUpload ? new Date(latestUpload.uploaded_at).toLocaleString('id-ID') : '-';
  $('#mBy').textContent = latestUpload?.uploaded_by || '-';
  $('#tbody').innerHTML = out.length ? out.map(rowHtml).join('') : '<tr><td colspan="8" class="muted">Data tidak ditemukan.</td></tr>';
}

function promoCount(p){
  return Object.keys(p || {}).length;
}

function rowHtml(r){
  return `<tr>
    <td>${esc(r.code || '-')}</td>
    <td><b>${esc(r.name)}</b></td>
    <td class="stock">${esc(r.stock_text || '-')}</td>
    <td class="price">${fmt(r.price_pcs)}</td>
    <td class="price">${fmt(r.price_dus)}</td>
    <td class="price">${fmt(r.price_pak)}</td>
    <td>${Object.keys(r.promos).length ? Object.entries(r.promos).map(([k,v]) => `<span class="promo">${k}: ${fmt(v)}</span>`).join('') : '-'}</td>
    <td>${esc(r.note || '')}</td>
  </tr>`;
}

function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$('#q').onfocus = () => {};
$('#q').oninput = () => renderRows(rows);
$('#promoFilter').onchange = () => renderRows(rows);
</script>

</body>
</html>
