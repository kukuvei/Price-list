<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price List</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"></script>
  <style>
    #logoutSalesBtn {
      position: fixed;
      top: 10px;
      right: 10px;
      padding: 8px 12px;
      background-color: #e74c3c;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Price List</h1>
  <div id="salesData">Loading Sales Data...</div>
  <button id="logoutSalesBtn">Logout</button>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    // --- Supabase Config ---
    const SUPABASE_URL = 'https://mitjosxpyeydjdrpuszl.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_-wwqDu_np893Rg32XajLEQ_w0-5MvBD';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentSessionId = null;

    // --- Check session on page load ---
    async function checkSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = 'https://login-page-gas-git-main-kukuveis-projects.vercel.app';
        return;
      }
      await logLoginSession(session);
      fetchSalesData();
    }

    // --- Log login ---
    async function logLoginSession(session) {
      const { data, error } = await supabase.from('user_sessions')
        .insert([{ user_id: session.user.id }])
        .select('id')
        .single();
      if (data) currentSessionId = data.id;
    }

    // --- Logout ---
    async function logout() {
      if(currentSessionId) {
        await supabase.from('user_sessions')
          .update({ logout_at: new Date() })
          .eq('id', currentSessionId);
      }
      await supabase.auth.signOut();
      window.location.href = 'https://login-page-gas-git-main-kukuveis-projects.vercel.app';
    }

    document.getElementById('logoutSalesBtn').addEventListener('click', logout);

    // --- Fetch Sales Data ---
    async function fetchSalesData() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return;

      const { data, error } = await supabase
        .from('price_items')
        .select('*');

      if(error) {
        document.getElementById('salesData').innerText = 'Error fetching data';
        console.error(error);
        return;
      }

      if(data && data.length) {
        const html = data.map(item => `<div>${item.name} - ${item.stock}</div>`).join('');
        document.getElementById('salesData').innerHTML = html;
      } else {
        document.getElementById('salesData').innerText = 'No Sales Data Available';
      }
    }

    // --- Init ---
    checkSession();
  </script>
</body>
</html>
