<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--pri:#2563eb;--shadow:0 10px 30px rgba(15,23,42,.08)}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:460px;margin:80px auto;padding:20px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:var(--shadow)}
    h1{margin:0 0 10px;font-size:26px}
    .small{font-size:13px;color:var(--muted);line-height:1.5}
    .input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;background:white}
    .btn{width:100%;margin-top:14px;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--pri);color:white}
    .status{margin-top:12px;font-size:14px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Ganti Password</h1>
      <p class="small">Masukkan password baru minimal 8 karakter, lalu simpan.</p>
      <input class="input" id="newPassword" type="password" placeholder="Password baru" />
      <input class="input" id="confirmPassword" type="password" placeholder="Ulangi password baru" />
      <button class="btn" id="saveBtn">Simpan Password</button>
      <div class="status" id="status"></div>
    </div>
  </div>

<script>
const SUPABASE_URL = "https://mitjosxpyeydjdrpuszl.supabase.co";
const SUPABASE_KEY = "sb_publishable_-wwqDu_np893Rg32XajLEQ_w0-5MvBD";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const statusEl = document.getElementById('status');

function setStatus(message, isError = false){
  statusEl.textContent = message || '';
  statusEl.style.color = isError ? '#dc2626' : '#16a34a';
}

document.getElementById('saveBtn').onclick = async () => {
  const password = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if(!password || password.length < 8){
    setStatus('Password minimal 8 karakter.', true);
    return;
  }

  if(password !== confirmPassword){
    setStatus('Konfirmasi password tidak sama.', true);
    return;
  }

  const { error } = await sb.auth.updateUser({ password });
  if(error){
    setStatus(error.message, true);
    return;
  }

  setStatus('Password berhasil diubah. Anda akan diarahkan ke halaman login.');
  setTimeout(() => {
    window.location.href = './index.html';
  }, 1800);
};
</script>
</body>
</html>
